</g>
<polygon points="0,150 300,128 640,146 940,124 1200,142 1200,210 0,210" fill="#7c84ac"/>
<polygon points="0,196 320,172 680,194 980,170 1200,190 1200,262 0,262" fill="#2c3060"/>
