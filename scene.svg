<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Two smoke columns over a ridge, rising and shearing out of step, watched from the cab">
<rect x="0" y="0" width="1200" height="150" fill="#c2d0e2"/>
<g stroke="#fafaf6" stroke-width="6" opacity="0.85">
<line x1="60" y1="36" x2="330" y2="24"><animate attributeName="x1" values="60;110;60" dur="17s" repeatCount="indefinite"/><animate attributeName="x2" values="330;380;330" dur="17s" repeatCount="indefinite"/></line>
<line x1="480" y1="66" x2="700" y2="56"><animate attributeName="x1" values="480;545;480" dur="23s" repeatCount="indefinite"/><animate attributeName="x2" values="700;765;700" dur="23s" repeatCount="indefinite"/></line>
